# Netlify configuration for the URML website (urml.dev).
#
# ─────────────────────────────────────────────────────────────────────
# REDESIGN BRANCH (redesign/astro-urml-dev) — Astro build.
#
# This file on THIS branch makes the branch's Netlify deploy-preview
# build the new Astro site. Production (urml.dev) is built from `main`,
# which still has the MkDocs config and is UNTOUCHED. There is no
# cutover here: the founder flips the site over by merging this branch
# to main as a deliberate, separate step. Until then this only affects
# the preview URL.
#
# The Astro site does not (yet) pull canonical content from core; the
# sync_from_core.py -> Astro content pipeline is a tracked follow-up.
# This foundation slice is the shell + Home page only.
# ─────────────────────────────────────────────────────────────────────

[build]
  publish = "dist"
  # The site is a rendering layer over canonical core. Clone the core
  # repo (public, no auth), sync the seven canonical docs into
  # src/content/core/ (link-rewritten), then build. `rm -rf urml-core`
  # first because Netlify reuses the workspace and urml-core/ is
  # gitignored, so it survives between builds and `git clone` would
  # fail "destination already exists" (same idiom as the MkDocs config
  # on main). If core is unreachable the committed src/content/core/
  # snapshot is what builds (sync-from-core keeps it on missing source).
  command = "rm -rf urml-core && git clone --depth 1 https://github.com/URML-MARS/URML.git urml-core && node scripts/sync-from-core.mjs urml-core && (npm ci || npm install) && npm run build"

[build.environment]
  NODE_VERSION = "20"

# The runtime network property: every request goes to this origin, with
# ONE deliberate exception. analytics.urml.dev is our own self-hosted
# Umami instance (first-party operated, cookieless, described on
# /privacy). It is allowlisted explicitly in script-src and connect-src
# rather than proxied through this origin, so it is visible in any
# browser's Network tab; hiding it behind a rewrite would defeat the
# "verify it yourself" stance on the privacy page. The tag itself only
# renders when the PUBLIC_UMAMI_* env vars are set (see Base.astro), so
# a build without them ships zero analytics and this allowlist entry
# sits unused. Everything below this exception is unchanged from the
# original "zero third-party network requests at runtime" posture.
#
# script-src is 'self' WITHOUT 'unsafe-inline': unlike Material for
# MkDocs (which ships inline bootstrap scripts), this Astro foundation
# slice emits zero inline scripts. Island hydration in later passes
# loads external module files, which 'self' already permits, so this
# does not need loosening when islands land.
#
# style-src keeps 'unsafe-inline': the design is faithfully ported with
# element-level inline styles (the prototype's style props), and Astro
# may inline small scoped styles. 'unsafe-inline' permits only inline
# CSS already in the HTML we built; it permits nothing cross-origin.
# default-src/font-src/img-src 'self' still block every other
# cross-origin request. Fonts are self-hosted (font-src 'self'); there
# is no Google Fonts.
#
# form-action 'self': the Join/Contact forms post to the Netlify Forms
# endpoint on this same origin. No third-party form service.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://analytics.urml.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://analytics.urml.dev; worker-src 'self' blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# API endpoints — never cache. Both intermediate CDNs and the browser
# should re-request these every time so subscriber state, admin actions,
# and (later) Gemini drafts are never served stale. Applies to all
# /api/* paths including /api/subscribers/* added in PR-B.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
