# Netlify configuration for the URML website (urml.dev).
#
# Deploy model: Netlify is connected to the GitHub repo URML-MARS/urml-website.
# Every push to the default branch triggers the build below. Netlify only
# checks out THIS repo, so the build clones the core URML repo (public, no
# auth needed) to pull canonical content via scripts/sync_from_core.py.

[build]
  publish = "site"
  command = """
    git clone --depth 1 https://github.com/URML-MARS/URML.git urml-core && \
    pip install 'mkdocs==1.6.*' 'mkdocs-material==9.7.*' && \
    python scripts/sync_from_core.py urml-core && \
    mkdocs build --strict
  """

[build.environment]
  PYTHON_VERSION = "3.11"

# Enforce the "no third-party network calls" property at the browser level.
# If any future change tries to pull a font, script, or tracker from another
# origin, the browser blocks it and it shows up immediately in testing.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
