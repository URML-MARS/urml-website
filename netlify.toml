# Netlify configuration for the URML website (urml.dev).
#
# Deploy model: Netlify is connected to the GitHub repo URML-MARS/urml-website.
# Every push to the default branch triggers the build below. Netlify only
# checks out THIS repo, so the build clones the core URML repo (public, no
# auth needed) to pull canonical content via scripts/sync_from_core.py.
#
# The leading `rm -rf urml-core` is load-bearing. Netlify does not do a clean
# checkout between builds; it reuses the repo dir with git fetch + checkout.
# Because urml-core/ is gitignored, git does not remove it on checkout, so it
# survives from the previous build and `git clone` then fails with
# "destination path 'urml-core' already exists". Removing it first makes the
# build idempotent and also guarantees the latest core content every run.

[build]
  publish = "site"
  command = """
    rm -rf urml-core && \
    git clone --depth 1 https://github.com/URML-MARS/URML.git urml-core && \
    pip install 'mkdocs==1.6.*' 'mkdocs-material==9.7.*' && \
    python scripts/sync_from_core.py urml-core && \
    mkdocs build --strict
  """

[build.environment]
  PYTHON_VERSION = "3.11"

# Enforce the "no third-party network calls" property at the browser level.
# If any future change tries to pull a font, script, or tracker from another
# origin, the browser blocks it and it shows up immediately in testing.
#
# script-src and style-src include 'unsafe-inline' on purpose. Material for
# MkDocs ships small inline bootstrap scripts (the __md_get/__md_set theme
# and palette helpers) and inline styles that are core to the theme and not
# removable by config. 'unsafe-inline' permits ONLY inline code already in
# the HTML we built; it does NOT permit loading anything from another
# origin. default-src/connect-src 'self' plus the per-type 'self' origin
# restrictions still block every cross-origin request, so the
# no-third-party-network property is intact. The relaxed protection
# (inline-injection XSS) is negligible on a static site with no user input
# and no reflected query params. Do not "harden" script-src back to 'self'
# only: it breaks the theme JS (light/dark toggle, etc.).
#
# form-action is 'self', not 'none', because the contact page posts to the
# Netlify Forms endpoint on this same origin (Netlify intercepts the POST
# at deploy-detected form paths). 'self' permits that and nothing
# cross-origin. There is no third-party form service.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
