site_name: URML
site_description: An open draft specification for natural-language robot control across ROS 2, PX4, and other substrates.
site_url: https://urml.dev/

# Discreet footer credit. URML is the face; MARS is acknowledged as the
# Phase 0 steward without coupling the standard to the entity. Plain text,
# no link, reversible. Kept deliberately small per the Phase 0 branding call.
copyright: "URML is an open specification under Apache 2.0. Stewarded by MARS during Phase 0."

# No `repo_url:` on purpose. Setting it makes Material's JS call
# api.github.com on every page load to fetch stars and latest release.
# Those calls violate the "zero third-party network requests at runtime"
# constraint in the plan §A9. The GitHub link lives in the page content
# instead (see docs/index.md).
#
# No analytics, no telemetry, no third-party trackers.
# The site is a rendering layer for canonical content in URML-MARS/URML.
# See README.md in this repository for the design constraint.

theme:
  name: material
  language: en
  font: false              # do not load Google Fonts; use system sans-serif
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - toc.follow

extra:
  # Remove the "Made with Material for MkDocs" generator notice from the
  # footer. The standard's official site should not carry a third-party
  # tooling credit. Supported flag, no theme override needed.
  generator: false

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list          # enables the { .md-button } link styling on the sent page
  - toc:
      permalink: true
  - pymdownx.superfences

# Same-origin stylesheet for the contact form. CSP style-src 'self' allows
# it; no policy change needed. Material's CSS variables keep it light/dark.
extra_css:
  - stylesheets/contact.css
  - stylesheets/integrations.css

nav:
  - Home: index.md
  - Compatible Runtimes: compatible-runtimes.md
  - Integrations: integrations.md
  - Submit your runtime: submit.md
  - Spec: spec.md
  - Manifesto: manifesto.md
  - Contact: contact.md
  - Trademark: trademark.md
  - Privacy: privacy.md

# contact-sent.md is the post-submit landing for the Netlify form. It is
# intentionally not a nav entry. Listing it here keeps `mkdocs build
# --strict` from failing on the "not in nav" warning.
not_in_nav: |
  /contact-sent.md
